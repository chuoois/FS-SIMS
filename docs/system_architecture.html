<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Architecture · FS-SIMS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 26px; background: #fff; color: #252525; font: 14px Arial, sans-serif; }
    main { max-width: 1180px; margin: auto; }
    h1 { margin: 0 0 22px; text-align: center; font-size: 22px; }
    .frame { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 940px; height: auto; }
    .area { fill: #ffdfb5; stroke: #dfa254; stroke-width: 1.7; }
    .dotted-area { fill: #ffedcf; stroke: #dfa254; stroke-width: 1.7; stroke-dasharray: 3 3; }
    .pkg { fill: #fff; stroke: #777; stroke-width: 1.3; }
    .green { fill: #dcebd7; stroke: #78ad69; stroke-width: 1.4; }
    .blue { fill: #dbe8fa; stroke: #7c9dcc; stroke-width: 1.5; }
    .external { fill: #fff; stroke: #777; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .label { font: 700 16px Arial, sans-serif; fill: #252525; }
    .text { font: 700 13px Arial, sans-serif; fill: #252525; }
    .small { font: 11px Arial, sans-serif; fill: #444; }
    .arrow { fill: none; stroke: #555; stroke-width: 1.6; marker-end: url(#arrow); }
    .dashed { fill: none; stroke: #777; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    @media print { body { padding: 8px; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>System Architecture · FS-SIMS</h1>
    <div class="frame">

        </defs>

        <rect class="area" x="255" y="35" width="575" height="560" rx="34"/>

        <text class="label" x="124" y="249" text-anchor="middle">CLIENT</text>
        <rect class="pkg" x="58" y="275" width="133" height="93" rx="13"/>
        <text class="text" x="124" y="309" text-anchor="middle">Web Browser</text>

        <rect class="pkg" x="596" y="181" width="163" height="70" rx="12"/>
        <text class="text" x="677" y="207" text-anchor="middle">Node.js · Express</text>
        <text class="small" x="677" y="230" text-anchor="middle">MVC · REST API</text>

        <text class="label" x="410" y="385" text-anchor="middle">phpMyAdmin</text>

        <rect class="pkg" x="903" y="338" width="159" height="91" rx="13"/>
        <text class="text" x="982" y="374" text-anchor="middle">Gmail SMTP</text>
        <text class="small" x="982" y="397" text-anchor="middle">Nodemailer</text>

        <path class="arrow" d="M217 309H296"/>
        <text class="small" x="257" y="298" text-anchor="middle">HTTP</text>
        <path class="arrow" d="M518 205H563"/>
        <text class="small" x="541" y="194" text-anchor="middle">REST API</text>
        <path class="arrow" d="M677 283V347"/>
        <text class="small" x="720" y="321">Sequelize</text>
        <path class="dashed" d="M518 428H563"/>
        <text class="small" x="541" y="417" text-anchor="middle">admin</text>
        <path class="dashed" d="M785 201H896"/>
        <text class="small" x="840" y="190" text-anchor="middle">HTTPS</text>
        <path class="dashed" d="M785 246H846V383H896"/>
        <text class="small" x="850" y="366">SMTP</text>

        <rect class="external" x="303" y="535" width="482" height="39" rx="10"/>
        <text class="text" x="544" y="560" text-anchor="middle">Docker Compose · production / development</text>
      </svg>
    </div>
  </main>
</body>
</html>
