<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Architecture · FS-SIMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { 
        margin: 0; 
        padding: 40px; 
        background: #f8fafc; 
        color: #1e293b; 
        font-family: 'Inter', sans-serif; 
    }
    main { max-width: 1200px; margin: auto; }
    h1 { margin: 0 0 30px; text-align: center; font-size: 26px; font-weight: 700; color: #0f172a; letter-spacing: -0.5px;}
    
    .frame { 
        background: #ffffff;
        padding: 20px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        overflow-x: auto; 
    }
    svg { display: block; width: 100%; min-width: 980px; height: auto; }
    
    /* Style cho các khối */
    .zone { fill: #fff; stroke: #e2e8f0; stroke-width: 2; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.02)); }
    .zone-inner { fill: #f1f5f9; stroke: none; }
    
    .node { fill: #ffffff; stroke-width: 1.5; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); transition: transform 0.2s; }
    .node:hover { transform: translateY(-2px); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
    
    /* Màu sắc chủ đạo */
    .stroke-frontend { stroke: #61dafb; }
    .stroke-backend { stroke: #68a063; }
    .stroke-db { stroke: #00758f; }
    .stroke-external { stroke: #94a3b8; stroke-dasharray: 5 5; }
    
    .label { font: 700 16px 'Inter', sans-serif; fill: #334155; letter-spacing: 0.5px; }
    .text { font: 600 14px 'Inter', sans-serif; fill: #1e293b; }
    .small { font: 12px 'Inter', sans-serif; fill: #64748b; }
    
    /* --- QUY ƯỚC ĐƯỜNG NỐI --- */
    /* Đường đi (Request) - Nét liền */
    .arrow-solid { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow-solid); }
    .arrow-solid-blue { fill: none; stroke: #3b82f6; stroke-width: 2; marker-end: url(#arrow-blue); }
    
    /* Đường về (Response) - Nét đứt */
    .arrow-dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#arrow-dashed); }
    .arrow-dashed-blue { fill: none; stroke: #93c5fd; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#arrow-blue-light); }

    /* Icon */
    .icon { fill: currentColor; }
    .icon-frontend { color: #61dafb; }
    .icon-backend { color: #68a063; }
    .icon-db { color: #00758f; }

    @media print { body { padding: 8px; background: #fff; } svg { min-width: 0; } .frame { box-shadow: none; padding: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>System Architecture · FS-SIMS</h1>
    <div class="frame">
      <svg viewBox="0 0 1120 650" role="img" aria-labelledby="diagram-title" xmlns="http://www.w3.org/2000/svg">
        <title id="diagram-title">FS-SIMS system architecture</title>
        <defs>
          <!-- Marker cho đường đi (Nét liền) -->
          <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
          <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#3b82f6"/></marker>
          
          <!-- Marker cho đường về (Nét đứt) -->
          <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker>
          <marker id="arrow-blue-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#93c5fd"/></marker>

          <!-- Gradient cho vùng chính -->
          <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffbf0" />
            <stop offset="100%" stop-color="#f0f9ff" />
          </linearGradient>
        </defs>

        <!-- Vùng chính (Main Container) -->
        <rect class="zone" x="255" y="35" width="590" height="570" rx="30" fill="url(#bg-grad)" stroke="#e2e8f0"/>

        <!-- Web Browser -->
        <g transform="translate(32, 218)">
            <rect class="zone" width="185" height="190" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
            <circle cx="92.5" cy="50" r="22" fill="#eff6ff" />
            <path d="M80 55 C80 45, 105 45, 105 55" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="92.5" cy="42" r="8" fill="#3b82f6" />
            <text class="text" x="92.5" y="95" text-anchor="middle">Web Browser</text>
            <text class="small" x="92.5" y="118" text-anchor="middle">Customer · Staff</text>
            <rect x="40" y="135" width="105" height="26" rx="13" fill="#f1f5f9" />
            <text class="small" x="92.5" y="152" text-anchor="middle" fill="#475569" font-weight="600">Owner Access</text>
        </g>

        <!-- Frontend -->
        <g transform="translate(303, 128)">
            <rect class="node stroke-frontend" width="225" height="165" rx="16"/>
            <g transform="translate(112.5, 45) scale(0.6)">
                <circle cx="0" cy="0" r="6" fill="#61dafb"/>
                <ellipse cx="0" cy="0" rx="30" ry="10" stroke="#61dafb" stroke-width="2" fill="none" transform="rotate(0)"/>
                <ellipse cx="0" cy="0" rx="30" ry="10" stroke="#61dafb" stroke-width="2" fill="none" transform="rotate(60)"/>
                <ellipse cx="0" cy="0" rx="30" ry="10" stroke="#61dafb" stroke-width="2" fill="none" transform="rotate(120)"/>
            </g>
            <text class="label" x="112.5" y="95" text-anchor="middle" fill="#0ea5e9">Frontend</text>
            <text class="text" x="112.5" y="118" text-anchor="middle">React · Vite</text>
            <text class="small" x="112.5" y="140" text-anchor="middle">Ports 80 / 5173</text>
        </g>

        <!-- Backend -->
        <g transform="translate(580, 128)">
            <rect class="node stroke-backend" width="225" height="165" rx="16"/>
            <path d="M112.5 30 L130 40 L130 60 L112.5 70 L95 60 L95 40 Z" fill="#f0fdf4" stroke="#68a063" stroke-width="2"/>
            <path d="M112.5 45 L130 40 M112.5 45 L95 40 M112.5 45 V70" stroke="#68a063" stroke-width="1.5"/>
            <text class="label" x="112.5" y="95" text-anchor="middle" fill="#15803d">Backend</text>
            <text class="text" x="112.5" y="118" text-anchor="middle">Node.js · Express</text>
            <text class="small" x="112.5" y="140" text-anchor="middle">Port 5000</text>
        </g>

        <!-- phpMyAdmin -->
        <g transform="translate(303, 354)">
            <rect class="node" width="225" height="150" rx="16" stroke="#94a3b8"/>
            <rect x="95" y="30" width="35" height="25" rx="4" fill="none" stroke="#64748b" stroke-width="2"/>
            <line x1="95" y1="38" x2="130" y2="38" stroke="#64748b" stroke-width="2"/>
            <circle cx="100" cy="34" r="1.5" fill="#64748b"/>
            <circle cx="105" cy="34" r="1.5" fill="#64748b"/>
            <text class="label" x="112.5" y="85" text-anchor="middle" fill="#475569">phpMyAdmin</text>
            <text class="small" x="112.5" y="108" text-anchor="middle">Database Admin UI</text>
            <text class="small" x="112.5" y="125" text-anchor="middle">Port 8080</text>
        </g>

        <!-- Database (MySQL) -->
        <g transform="translate(580, 354)">
            <rect class="node stroke-db" width="225" height="168" rx="16" fill="#f8fafc"/>
            <g transform="translate(112.5, 45)">
                <ellipse cx="0" cy="15" rx="25" ry="10" fill="#e0f2fe" stroke="#00758f" stroke-width="2"/>
                <path d="M-25 15 V-5 C-25 -15, 25 -15, 25 -5 V15" fill="none" stroke="#00758f" stroke-width="2"/>
                <ellipse cx="0" cy="-5" rx="25" ry="10" fill="#bae6fd" stroke="#00758f" stroke-width="2"/>
                <circle cx="-8" cy="-5" r="2" fill="#00758f"/>
                <circle cx="8" cy="-5" r="2" fill="#00758f"/>
            </g>
            <text class="label" x="112.5" y="95" text-anchor="middle" fill="#0369a1">MySQL 8</text>
            <text class="small" x="112.5" y="118" text-anchor="middle">Port 3306</text>
            <text class="small" x="112.5" y="135" text-anchor="middle">Persistent Volume</text>
        </g>

        <!-- External Services -->
        <g transform="translate(885, 147)">
            <rect class="zone" width="205" height="370" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="8 4"/>
            <text class="label" x="102.5" y="35" text-anchor="middle" fill="#94a3b8" style="font-size: 11px;">THIRD PARTY</text>
            
            <g transform="translate(20, 60)">
                <rect class="node" width="165" height="95" rx="12"/>
                <path d="M65 35 Q65 20 80 20 Q95 20 95 35 Q110 35 110 50 Q110 65 95 65 H65 Q50 65 50 50 Q50 35 65 35" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
                <text class="text" x="82.5" y="85" text-anchor="middle" font-size="12">Cloudinary</text>
            </g>

            <g transform="translate(20, 190)">
                <rect class="node" width="165" height="95" rx="12"/>
                <rect x="60" y="30" width="45" height="30" rx="3" fill="none" stroke="#ef4444" stroke-width="2"/>
                <path d="M60 30 L82.5 48 L105 30" fill="none" stroke="#ef4444" stroke-width="2"/>
                <text class="text" x="82.5" y="85" text-anchor="middle" font-size="12">Gmail SMTP</text>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- CONNECTIONS (NÉT LIỀN: ĐI - NÉT ĐỨT: VỀ)  -->
        <!-- ========================================== -->

        <!-- 1. Browser <-> Frontend -->
        <!-- Đi: Browser -> Frontend (Nét liền) -->
        <path class="arrow-solid" d="M217 300 H290"/>
        <rect x="235" y="287" width="40" height="16" rx="4" fill="#eff6ff"/>
        <text class="small" x="255" y="299" text-anchor="middle" fill="#3b82f6" font-weight="bold">HTTP</text>
        <!-- Về: Frontend -> Browser (Nét đứt) -->
        <path class="arrow-dashed" d="M290 330 H217"/>

        <!-- 2. Frontend <-> Backend -->
        <!-- Đi: Frontend -> Backend (Nét liền) -->
        <path class="arrow-solid-blue" d="M528 195 H565"/>
        <rect x="530" y="182" width="60" height="16" rx="4" fill="#eff6ff"/>
        <text class="small" x="560" y="194" text-anchor="middle" fill="#3b82f6" font-weight="bold">REST API</text>
        <!-- Về: Backend -> Frontend (Nét đứt) -->
        <path class="arrow-dashed-blue" d="M565 225 H528"/>

        <!-- 3. Backend <-> Database -->
        <!-- Đi: Backend -> DB (Nét liền) -->
        <path class="arrow-solid" d="M680 293 V340"/>
        <rect x="690" y="308" width="60" height="16" rx="4" fill="#f1f5f9"/>
        <text class="small" x="720" y="320" text-anchor="middle" fill="#64748b" font-weight="bold">Sequelize</text>
        <!-- Về: DB -> Backend (Nét đứt) -->
        <path class="arrow-dashed" d="M710 340 V293"/>

        <!-- 4. phpMyAdmin <-> Database -->
        <!-- Đi: phpMyAdmin -> DB (Nét liền) -->
        <path class="arrow-solid" d="M528 420 H565"/>
        <rect x="530" y="407" width="45" height="16" rx="4" fill="#f1f5f9"/>
        <text class="small" x="552" y="419" text-anchor="middle" fill="#64748b">admin</text>
        <!-- Về: DB -> phpMyAdmin (Nét đứt) -->
        <path class="arrow-dashed" d="M565 440 H528"/>

        <!-- 5. Backend <-> Cloudinary -->
        <!-- Đi: Backend -> Cloudinary (Nét liền) -->
        <path class="arrow-solid" d="M805 195 H875"/>
        <text class="small" x="840" y="187" text-anchor="middle" fill="#64748b" font-weight="bold">HTTP</text>
        <!-- Về: Cloudinary -> Backend (Nét đứt) -->
        <path class="arrow-dashed" d="M875 215 H805"/>

        <!-- 6. Backend <-> Gmail SMTP -->
        <!-- Đi: Backend -> SMTP (Nét liền) -->
        <path class="arrow-solid" d="M805 240 H840 V385 H875"/>
        <text class="small" x="848" y="370" text-anchor="middle" fill="#64748b" font-weight="bold">SMTP</text>
        <!-- Về: SMTP -> Backend (Nét đứt, đi đường vòng để tránh đè) -->
        <path class="arrow-dashed" d="M875 405 H820 V260 H805"/>

      </svg>
    </div>
  </main>
</body>
</html>
