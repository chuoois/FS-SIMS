<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backend Package Diagram · FS-SIMS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #fff; color: #222; font: 14px Arial, sans-serif; }
    main { max-width: 1040px; margin: 0 auto; }
    h1 { margin: 0 0 20px; text-align: center; font-size: 21px; }
    .diagram { display: block; width: 100%; height: auto; }
    .package, .tab, .item { fill: #fff; stroke: #333; stroke-width: 1.2; }
    .title { font-size: 15px; font-weight: 700; fill: #222; }
    .label { font-size: 12px; font-weight: 600; fill: #222; }
    .small { font-size: 10.5px; fill: #333; }
    .link { fill: none; stroke: #555; stroke-width: 1.2; marker-end: url(#arrow); }
    @media (max-width: 700px) { body { padding: 12px 6px; } h1 { font-size: 17px; } }
    @media print { body { padding: 8px; } }
  </style>
</head>
<body>
<main>
  <h1>Backend Package Diagram · FS-SIMS</h1>
  <svg class="diagram" viewBox="0 0 1000 650" role="img" aria-labelledby="diagram-title diagram-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="diagram-title">Backend package structure</title>
    <desc id="diagram-desc">Node.js backend packages and dependencies, based on the actual source folders.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#555" stroke-width="1"/></marker>
    </defs>

    <path class="link" d="M300 86 H355"/>
    <path class="link" d="M185 61 V40 H787 V67"/>
    <path class="link" d="M470 123 V160 H190 V201"/>
    <path class="link" d="M190 258 V323"/>
    <path class="link" d="M305 225 H355"/>
    <path class="link" d="M190 396 V473"/>
    <path class="link" d="M300 360 H355"/>
    <path class="link" d="M300 377 H326 V510 H355"/>
    <path class="link" d="M470 423 V473"/>
    <path class="link" d="M300 510 H610 V100 H669"/>
    <path class="link" d="M585 377 H625 V100 H669"/>
    <path class="link" d="M585 225 H640 V112 H669"/>

    <g>
      <path class="package" d="M70 73 H126 V61 H177 V73 H300 V123 H70 Z"/>
      <text class="title" x="185" y="96" text-anchor="middle">server.js</text>
      <text class="small" x="185" y="113" text-anchor="middle">backend entry point</text>
    </g>
    <g>
      <path class="package" d="M355 73 H415 V61 H466 V73 H585 V123 H355 Z"/>
      <text class="title" x="470" y="96" text-anchor="middle">src/app.js</text>
      <text class="small" x="470" y="113" text-anchor="middle">Express app · global middleware · route mounts</text>
    </g>
    <g>
      <path class="package" d="M675 73 H735 V61 H786 V73 H900 V123 H675 Z"/>
      <text class="title" x="787" y="96" text-anchor="middle">config/</text>
      <text class="small" x="787" y="113" text-anchor="middle">sequelize.js · cloudinary.js</text>
    </g>

    <g>
      <path class="package" d="M70 208 H126 V196 H177 V208 H300 V258 H70 Z"/>
      <text class="title" x="185" y="231" text-anchor="middle">routes/</text>
      <text class="small" x="185" y="248" text-anchor="middle">auth · products · orders · staff · ...</text>
    </g>
    <g>
      <path class="package" d="M355 208 H415 V196 H466 V208 H585 V258 H355 Z"/>
      <text class="title" x="470" y="231" text-anchor="middle">middlewares/</text>
      <text class="small" x="470" y="248" text-anchor="middle">auth · upload · traceId · error handling</text>
    </g>

    <g>
      <path class="package" d="M70 336 H126 V324 H177 V336 H300 V396 H70 Z"/>
      <text class="title" x="185" y="360" text-anchor="middle">controllers/</text>
      <text class="small" x="185" y="379" text-anchor="middle">Request handling · application flows</text>
    </g>
    <g>
      <path class="package" d="M355 336 H415 V324 H466 V336 H585 V423 H355 Z"/>
      <text class="title" x="470" y="360" text-anchor="middle">services/</text>
      <text class="small" x="470" y="380" text-anchor="middle">mailService.js</text>
      <text class="small" x="470" y="398" text-anchor="middle">cloudinaryService.js</text>
    </g>

    <g>
      <path class="package" d="M70 485 H126 V473 H177 V485 H300 V545 H70 Z"/>
      <text class="title" x="185" y="509" text-anchor="middle">models/</text>
      <text class="small" x="185" y="528" text-anchor="middle">Sequelize models · index.js associations</text>
    </g>
    <g>
      <path class="package" d="M355 485 H415 V473 H466 V485 H585 V545 H355 Z"/>
      <text class="title" x="470" y="509" text-anchor="middle">utils/</text>
      <text class="small" x="470" y="528" text-anchor="middle">validators · ApiError · response helpers</text>
    </g>
  </svg>
</main>
</body>
</html>
