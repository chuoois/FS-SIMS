<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backend Package Diagram · FS-SIMS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #fff; color: #252525; font: 14px Arial, sans-serif; }
    main { max-width: 1120px; margin: auto; }
    h1 { margin: 0 0 24px; text-align: center; font-size: 22px; }
    .frame { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 900px; height: auto; }
    .area { fill: #ffdfb5; stroke: #dfa254; stroke-width: 1.7; }
    .subarea { fill: #fff; stroke: #777; stroke-width: 1.3; stroke-dasharray: 7 5; }
    .pkg { fill: #fff; stroke: #777; stroke-width: 1.4; }
    .node { fill: #fff0c7; stroke: #ddb84b; stroke-width: 1.4; }
    .db { fill: #dbe8fa; stroke: #7c9dcc; stroke-width: 1.6; }
    .external { fill: #fff; stroke: #777; stroke-width: 1.3; stroke-dasharray: 6 4; }
    .label { font: 700 17px Arial, sans-serif; fill: #252525; }
    .text { font: 700 14px Arial, sans-serif; fill: #252525; }
    .small { font: 12px Arial, sans-serif; fill: #444; }
    .arrow { fill: none; stroke: #555; stroke-width: 1.7; marker-end: url(#arrow); }
    .dashed { fill: none; stroke: #777; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    @media print { body { padding: 8px; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>Backend Package Diagram · FS-SIMS</h1>
    <div class="frame">
      <svg viewBox="0 0 1080 690" role="img" aria-labelledby="diagram-title" xmlns="http://www.w3.org/2000/svg">
        <title id="diagram-title">Node.js Express MVC backend package diagram</title>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#555"/></marker>
        </defs>

        <rect class="area" x="275" y="38" width="510" height="100" rx="22"/>
        <text class="label" x="530" y="66" text-anchor="middle">BACKEND STARTUP</text>
        <rect class="pkg" x="310" y="83" width="180" height="38" rx="8"/>
        <text class="text" x="400" y="107" text-anchor="middle">server.js</text>
        <rect class="pkg" x="570" y="83" width="180" height="38" rx="8"/>
        <text class="text" x="660" y="107" text-anchor="middle">src/app.js</text>
        <path class="arrow" d="M490 102H565"/>

        <rect class="area" x="50" y="190" width="980" height="255" rx="28"/>
        <text class="label" x="540" y="220" text-anchor="middle">PRESENTATION · backend/src</text>

        <rect class="pkg" x="90" y="255" width="200" height="145" rx="12"/>
        <text class="text" x="190" y="283" text-anchor="middle">Routes</text>
        <text class="small" x="190" y="309" text-anchor="middle">authRoutes.js</text>
        <text class="small" x="190" y="330" text-anchor="middle">productRoutes.js</text>
        <text class="small" x="190" y="351" text-anchor="middle">… route modules</text>

        <rect class="pkg" x="350" y="255" width="200" height="145" rx="12"/>
        <text class="text" x="450" y="283" text-anchor="middle">Middlewares</text>
        <text class="small" x="450" y="309" text-anchor="middle">Authentication · roles</text>
        <text class="small" x="450" y="330" text-anchor="middle">Upload · traceId</text>
        <text class="small" x="450" y="351" text-anchor="middle">Errors · not found</text>

        <rect class="pkg" x="610" y="255" width="200" height="145" rx="12"/>
        <text class="text" x="710" y="283" text-anchor="middle">Controllers</text>
        <text class="small" x="710" y="309" text-anchor="middle">authController.js</text>
        <text class="small" x="710" y="330" text-anchor="middle">productController.js</text>
        <text class="small" x="710" y="351" text-anchor="middle">… controller modules</text>

        <rect class="pkg" x="855" y="255" width="140" height="145" rx="12"/>
        <text class="text" x="925" y="283" text-anchor="middle">Utils</text>
        <text class="small" x="925" y="309" text-anchor="middle">Validators</text>
        <text class="small" x="925" y="330" text-anchor="middle">ApiError</text>
        <text class="small" x="925" y="351" text-anchor="middle">Response helpers</text>

        <path class="arrow" d="M660 138V170H190V249"/>
        <path class="arrow" d="M290 327H344"/>
        <path class="arrow" d="M550 327H604"/>
        <path class="dashed" d="M450 255V235H925V249"/>
        <path class="dashed" d="M710 255V237H925V249"/>

        <rect class="area" x="220" y="505" width="370" height="125" rx="24"/>
        <text class="label" x="405" y="535" text-anchor="middle">DATA ACCESS</text>
        <rect class="pkg" x="250" y="556" width="175" height="52" rx="9"/>
        <text class="text" x="337" y="579" text-anchor="middle">Sequelize Models</text>
        <text class="small" x="337" y="597" text-anchor="middle">models/</text>
        <rect class="pkg" x="450" y="556" width="115" height="52" rx="9"/>
        <text class="text" x="507" y="579" text-anchor="middle">Associations</text>
        <text class="small" x="507" y="597" text-anchor="middle">models/index.js</text>
        <path class="arrow" d="M710 400V467H337V550"/>

        <rect class="area" x="655" y="505" width="375" height="125" rx="24"/>
        <text class="label" x="842" y="535" text-anchor="middle">INTEGRATIONS</text>
        <rect class="pkg" x="685" y="556" width="155" height="52" rx="9"/>
        <text class="text" x="762" y="579" text-anchor="middle">Services</text>
        <text class="small" x="762" y="597" text-anchor="middle">Mail · Cloudinary</text>
        <rect class="pkg" x="860" y="556" width="140" height="52" rx="9"/>
        <text class="text" x="930" y="579" text-anchor="middle">Config</text>
        <text class="small" x="930" y="597" text-anchor="middle">Sequelize</text>
        <path class="arrow" d="M710 400V474H762V550"/>

        <rect class="db" x="265" y="648" width="245" height="34" rx="9"/>
        <text class="text" x="387" y="670" text-anchor="middle">MySQL · database/init.sql</text>
        <path class="arrow" d="M337 608V642"/>
        <path class="arrow" d="M930 608V635H500V642"/>

        <rect class="external" x="700" y="648" width="285" height="34" rx="9"/>
        <text class="text" x="842" y="670" text-anchor="middle">Gmail SMTP · Cloudinary</text>
        <path class="dashed" d="M762 608V642"/>
      </svg>
    </div>
  </main>
</body>
</html>
