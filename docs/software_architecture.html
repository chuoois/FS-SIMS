<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software Architecture - FS-SIMS</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #fff; color: #263238; font: 14px Arial, sans-serif; }
    main { max-width: 1400px; margin: 0 auto; }
    h1 { margin: 0 0 18px; text-align: center; font-size: 23px; }
    .frame { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1050px; height: auto; }
    
    .system { fill: #fff; stroke: #aaa; stroke-width: 2; }
    .layer { fill: #fff; stroke: #999; stroke-width: 1.8; }
    .fe-node { fill: #e8f1ff; stroke: #9bbbe7; stroke-width: 1.5; }
    .be-node { fill: #e8f1ff; stroke: #9bbbe7; stroke-width: 1.5; }
    .api-node { fill: #eee5f8; stroke: #c8b4df; stroke-width: 1.6; }
    .db-box { fill: #edf5f5; stroke: #82999b; stroke-width: 1.7; }
    .external-box { fill: #fff; stroke: #999; stroke-width: 1.8; }
    .external-node { fill: #fff1d1; stroke: #e2c982; stroke-width: 1.5; }

    .title { font: 700 17px Arial, sans-serif; fill: #263238; }
    .group-title { font: 700 15px Arial, sans-serif; fill: #263238; }
    .tech { font: 600 12px Arial, sans-serif; fill: #776994; }
    .node-title { font: 600 14px Arial, sans-serif; fill: #334155; }
    .node-small { font: 12px Arial, sans-serif; fill: #475569; }

    .line { fill: none; stroke: #60676c; stroke-width: 1.7; marker-end: url(#arrow); }
    .line-dashed { fill: none; stroke: #778187; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrow-dashed); }
    .line-label { font: 12px Arial, sans-serif; fill: #4b5563; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }

    .actor { fill: none; stroke: #475569; stroke-width: 2; stroke-linecap: round; }
    
    /* Style cho Icon */
    .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .c-cloud { color: #3b82f6; }
    .c-mail { color: #ef4444; }
    .c-db { color: #00758f; }
    .c-browser { color: #3b82f6; }

    @media print { body { padding: 8px; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>Software Architecture - FS-SIMS</h1>
    <div class="frame">
      <svg viewBox="0 0 1280 850" role="img" aria-labelledby="diagram-title" xmlns="http://www.w3.org/2000/svg">
        <title id="diagram-title">Software Architecture FS-SIMS</title>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#60676c"/></marker>
          <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#778187"/></marker>
        </defs>

        <!-- Third-party services (Layer trên cùng) -->
        <rect class="external-box" x="710" y="24" width="450" height="116" rx="20"/>
        <text class="group-title" x="732" y="51">Third-party Services</text>
        
        <!-- Cloudinary (Thêm Icon) -->
        <g transform="translate(746, 70)">
            <rect class="external-node" width="180" height="48" rx="9"/>
            <path class="icon c-cloud" d="M90 18 Q90 10 98 10 Q106 10 106 18 Q114 18 114 26 Q114 34 106 34 H90 Q82 34 82 26 Q82 18 90 18" />
            <text class="node-title" x="130" y="29" text-anchor="start">Cloudinary API</text>
        </g>

        <!-- Gmail (Thêm Icon) -->
        <g transform="translate(950, 70)">
            <rect class="external-node" width="180" height="48" rx="9"/>
            <rect class="icon c-mail" x="86" y="12" width="24" height="16" rx="2"/>
            <path class="icon c-mail" d="M86 12 L98 22 L110 12"/>
            <text class="node-title" x="126" y="29" text-anchor="start">Gmail SMTP</text>
        </g>

        <!-- Main application boundary -->
        <rect class="system" x="215" y="164" width="990" height="535" rx="40"/>
        <text class="title" x="244" y="195" fill="#b85b8b">Furniture Sales &amp; Inventory Management System</text>

        <!-- Front-end Layer -->
        <rect class="layer" x="250" y="222" width="250" height="425" rx="28"/>
        <text class="group-title" x="273" y="251">Front-end</text>
        
        <rect class="fe-node" x="285" y="274" width="180" height="56" rx="10"/>
        <text class="node-title" x="375" y="308" text-anchor="middle">Router + Guards</text>
        
        <rect class="fe-node" x="285" y="365" width="180" height="56" rx="10"/>
        <text class="node-title" x="375" y="399" text-anchor="middle">Pages + Layouts</text>
        
        <rect class="fe-node" x="285" y="456" width="180" height="56" rx="10"/>
        <text class="node-title" x="375" y="490" text-anchor="middle">Services (Axios)</text>
        
        <rect class="fe-node" x="270" y="547" width="210" height="62" rx="10"/>
        <text class="node-small" x="375" y="572" text-anchor="middle">Components · Context · Hooks</text>
        <text class="node-small" x="375" y="591" text-anchor="middle">Utils</text>
        <text class="tech" x="375" y="631" text-anchor="middle">React + Vite</text>

        <!-- HTTPS REST API (Trung gian) -->
        <rect class="api-node" x="550" y="352" width="126" height="176" rx="8"/>
        <text class="node-title" x="613" y="418" text-anchor="middle">HTTPS</text>
        <text class="node-title" x="613" y="441" text-anchor="middle">REST API</text>

        <!-- Back-end Layer -->
        <rect class="layer" x="720" y="222" width="450" height="425" rx="28"/>
        <text class="group-title" x="744" y="251">Back-end</text>
        <text class="tech" x="744" y="273">Node.js + Express + Sequelize</text>

        <rect class="be-node" x="745" y="293" width="170" height="58" rx="10"/>
        <text class="node-title" x="830" y="328" text-anchor="middle">Routes</text>
        
        <rect class="be-node" x="960" y="293" width="175" height="58" rx="10"/>
        <text class="node-title" x="1047" y="328" text-anchor="middle">Middleware</text>

        <rect class="be-node" x="745" y="391" width="170" height="68" rx="10"/>
        <text class="node-title" x="830" y="431" text-anchor="middle">Controllers</text>
        
        <rect class="be-node" x="960" y="381" width="175" height="91" rx="10"/>
        <text class="node-title" x="1047" y="402" text-anchor="middle">Services</text>
        <text class="node-small" x="1047" y="427" text-anchor="middle">cloudinaryService</text>
        <text class="node-small" x="1047" y="449" text-anchor="middle">mailService (Nodemailer)</text>

        <rect class="be-node" x="835" y="520" width="190" height="67" rx="10"/>
        <text class="node-title" x="930" y="548" text-anchor="middle">Models</text>
        <text class="node-small" x="930" y="570" text-anchor="middle">Sequelize models</text>

        <!-- Client and browser -->
        <circle class="actor" cx="42" cy="398" r="10"/>
        <path class="actor" d="M42 408 V443 M42 417 L25 430 M42 417 L60 430 M42 443 L28 463 M42 443 L57 463"/>
        <text class="node-small" x="42" y="482" text-anchor="middle">Users</text>
        
        <!-- Browser (Thêm Icon) -->
        <rect class="layer" x="82" y="397" width="112" height="68" rx="14"/>
        <g transform="translate(101, 410)">
            <rect class="fe-node" width="74" height="39" rx="3"/>
            <rect class="icon c-browser" x="22" y="8" width="30" height="20" rx="2"/>
            <line class="icon c-browser" x1="22" y1="14" x2="52" y2="14"/>
            <circle cx="27" cy="11" r="1" fill="#3b82f6"/>
            <circle cx="31" cy="11" r="1" fill="#3b82f6"/>
        </g>
        <text class="node-small" x="138" y="462" text-anchor="middle">Browser</text>

        <!-- MySQL database (Thêm Icon con Heo) -->
        <rect class="external-box" x="842" y="715" width="210" height="112" rx="18"/>
        <text class="group-title" x="862" y="740">Database</text>
        <g transform="translate(947, 760)">
            <ellipse class="icon c-db" cx="0" cy="15" rx="28" ry="10" fill="#e0f2fe"/>
            <path class="icon c-db" d="M-28 15 V-5 C-28 -15, 28 -15, 28 -5 V15" fill="none"/>
            <ellipse class="icon c-db" cx="0" cy="-5" rx="28" ry="10" fill="#bae6fd"/>
            <circle cx="-8" cy="-5" r="2" fill="#00758f"/>
            <circle cx="8" cy="-5" r="2" fill="#00758f"/>
        </g>
        <text class="node-small" x="947" y="811" text-anchor="middle">MySQL</text>

        <!-- ========================================== -->
        <!-- ĐƯỜNG NỐI (GIỮ NGUYÊN LOGIC VUÔNG VẮN)     -->
        <!-- ========================================== -->

        <!-- 1. Users -> Browser -->
        <path class="line" d="M60 429 H82"/>

        <!-- 2. Browser <-> Frontend -->
        <path class="line" d="M194 415 H250"/>
        <text class="line-label" x="222" y="405" text-anchor="middle">HTTPS</text>
        <path class="line-dashed" d="M250 445 H194"/>

        <!-- 3. Frontend Nội bộ -->
        <path class="line" d="M375 330 V365"/>
        <path class="line" d="M375 421 V456"/>
        <path class="line" d="M375 512 V547"/>

        <!-- 4. Frontend (Axios) <-> API <-> Backend (Routes) -->
        <path class="line" d="M465 472 H513 V397 H550"/>
        <path class="line-dashed" d="M550 482 H530 V500 H465"/>
        
        <path class="line" d="M676 397 H692 V322 H745"/>
        <text class="line-label" x="706" y="310" text-anchor="middle">Request</text>
        <path class="line-dashed" d="M745 336 H706 V472 H676"/>
        <text class="line-label" x="708" y="463" text-anchor="middle">Response</text>

        <!-- 5. Backend Nội bộ -->
        <path class="line" d="M915 322 H960"/>
        <path class="line" d="M1047 351 V365 H830 V391"/>
        <path class="line" d="M915 425 H960"/>
        <path class="line" d="M830 459 V490 H930 V520"/>
        <text class="line-label" x="945" y="505" text-anchor="middle">Sequelize</text>

        <!-- 6. Services <-> Third-party APIs -->
        <path class="line" d="M1135 402 H1220 V150 H836 V118"/>
        <path class="line" d="M1135 448 H1260 V145 H1040 V118"/>

        <!-- 7. Models -> Database -->
        <path class="line" d="M930 587 V715"/>
      </svg>
    </div>
  </main>
</body>
</html>
